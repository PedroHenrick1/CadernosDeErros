<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Criar Nova Conta</h2>
      <p class="auth-subtitle">Crie sua conta para começar a registrar e revisar seus erros de concursos e provas.</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="registerData.nome"
          placeholder="Seu nome completo"
          class="form-control"
          required
          minlength="2"
          #nomeInput="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="registerData.email"
          placeholder="seu.email@exemplo.com"
          class="form-control"
          required
          email
          #emailInput="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="registerData.senha"
          placeholder="Mínimo 6 caracteres"
          class="form-control"
          required
          minlength="6"
          #senhaInput="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          [(ngModel)]="confirmarSenha"
          placeholder="Repita a senha"
          class="form-control"
          required
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading || !registerForm.valid"
      >
        <span *ngIf="!loading">Criar Minha Conta</span>
        <span *ngIf="loading">Cadastrando...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Já possui uma conta? <a routerLink="/login">Faça Login</a></p>
    </div>
  </div>
</div>
